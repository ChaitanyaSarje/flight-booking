<header class="app-header">
  <a class="logo" routerLink="/flights">FLIGHT-BOOKING</a>
  <nav>
    @if (auth.currentUser()) {
      <a routerLink="/flights" routerLinkActive="active">Flights</a>
      <a routerLink="/my-bookings" routerLinkActive="active">My bookings</a>
      <span class="user-name">{{ auth.currentUser()!.name }}</span>
      <button (click)="logout()" routerLink="/login">Logout</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Login</a>
      <a routerLink="/register" routerLinkActive="active">Register</a>
    }
  </nav>
</header>
<router-outlet />
