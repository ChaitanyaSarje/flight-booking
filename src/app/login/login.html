<div class="login-container">

  <div class="login-card">

    <h1>Flight Booking</h1>

    <h2>Login</h2>

    <p class="subtitle">
      Login to continue your flight booking
    </p>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="loginData.email"
          placeholder="Enter your email"
          required
        />

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="loginData.password"
          placeholder="Enter your password"
          required
        />

      </div>

      <button type="submit">
        Login
      </button>

    </form>

    @if (successMessage) {
      <p class="success">
        {{ successMessage }}
      </p>
    }

    @if (errorMessage) {
      <p class="error">
        {{ errorMessage }}
      </p>
    }

  </div>

</div>
